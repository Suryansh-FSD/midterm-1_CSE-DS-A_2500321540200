<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Inventory System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Inventory Management Application</h1>


        <nav class="nav-bar">
            <a href="products.html" class="nav-link">View Products</a>
        </nav>


        <div class="card">
            <h2>Add New Product</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="id">Product ID:</label>
                    <input type="number" id="id" placeholder="Enter ID" required>
                </div>

                <div class="form-group">
                    <label for="name">Product Name:</label>
                    <input type="text" id="name" placeholder="Enter Name" required>
                </div>

                <div class="form-group">
                    <label for="price">Price:</label>
                    <input type="number" id="price" placeholder="Enter Price" required>
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <input type="text" id="category" placeholder="Enter Category" required>
                </div>

                <button type="submit" class="btn-submit">Save Products</button>
            </form>
        </div>
    </div>

    <script src="JS.js"></script>
</body>
</html>
